name: Auto Merge

on:
  workflow_run:
    workflows: ["Build webshop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-after-successful-build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only the exact commit that passed the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state open --json url,headRefOid --jq '.[] | select(.headRefOid == env.BUILT_SHA) | .url' | head -n 1)"
          if [ -z "$PR_JSON" ]; then
            echo "No open pull request still points to the tested commit $BUILT_SHA; skipping merge."
            exit 0
          fi
          gh pr merge "$PR_JSON" --squash
