name: Auto Merge

on:
  workflow_run:
    workflows: ["Build webshop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-after-successful-build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request after successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            echo "No open pull request found for $BRANCH_NAME; nothing to merge."
            exit 0
          fi
          gh pr merge "$PR_URL" --squash
